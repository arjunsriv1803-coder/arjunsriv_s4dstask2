<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Manhattan — Interactive 3D City</title>
    <meta
      name="description"
      content="A photogrammetry scan of Lower Manhattan, optimised from 519 MB to 11 MB and rendered in the browser with React Three Fiber."
    />

    <!-- Matches the intro overlay's gradient, so mobile browser chrome does not
         clash with the first thing on screen. -->
    <meta name="theme-color" content="#16283c" />

    <!-- Link previews. No og:image yet - it would point at a screenshot that does
         not exist, and a broken preview image is worse than none. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Manhattan — Interactive 3D City" />
    <meta
      property="og:description"
      content="A photogrammetry scan of Lower Manhattan, optimised from 519 MB to 11 MB and rendered in the browser."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
